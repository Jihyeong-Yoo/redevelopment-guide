<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신속통합기획 | 재개발 공부 노트</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1b2b43;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;line-height:1.7}header{background:linear-gradient(110deg,#17335f,#366eb8);color:#fff;padding:46px max(22px,calc((100vw - 880px)/2))}header a{color:#d8e9ff;text-decoration:none}h1{font-size:clamp(29px,5vw,42px);margin:14px 0 6px}main{max-width:920px;margin:28px auto;padding:0 18px 60px}.card{background:#fff;border:1px solid #dce5f2;border-radius:16px;padding:25px;margin-bottom:16px;box-shadow:0 6px 20px #17355c0d}h2{font-size:20px;margin:0 0 10px}.pill{display:inline-block;background:#e4efff;color:#2055a2;border-radius:99px;padding:3px 11px;font-weight:700;font-size:13px}.notice{background:#eaf2ff;border-left:4px solid #3973cb;border-radius:8px;padding:14px}a{color:#245eb2}p{margin:8px 0}</style></head><body><header><a href="/">← 전체 개발방식 보기</a><h1>신속통합기획</h1><span class="pill">민간주도</span></header><main><section class="card"><h2>사업 개요</h2><p>서울시가 정비계획 수립을 지원하는 제도입니다. 일반 재개발과 별개의 사업방식은 아닙니다.</p></section><section class="card"><h2>주요 법적 근거</h2><p>도시 및 주거환경정비법 및 서울시 신속통합기획 운영기준</p></section><section class="card"><h2>용적률은 어떻게 결정될까?</h2><p>신속통합기획을 적용했다고 정해진 용적률이 자동 보장되지는 않습니다.</p><p class="notice">용적률 수치는 대상지의 용도지역·정비계획·공공기여·건축제한을 확인한 뒤 계산해야 합니다.</p></section><section class="card"><h2>공부할 핵심</h2><p>민간재개발의 사업 절차에 서울시의 계획 수립 지원이 결합됩니다.</p></section><a href="/">← 메인 페이지로 돌아가기</a></main></body></html>
